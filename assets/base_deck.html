<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[Cliente] &middot; [Titulo]</title>
<!-- base_deck.html: replace tokens from design_system.md; slides =<section class="slide [hero|depth|spotlight]"> -->
<style>
:root{--bg:#FAFAFA;--fg:#0F0F0F;--fg-2:#555;--accent:#000;--surface-1:#FFF;--hairline:rgba(0,0,0,.12);
--font-display:system-ui,sans-serif;--font-body:system-ui,sans-serif;--deck-scale:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body)}
#deck{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--deck-scale));transform-origin:center}
.slide{position:absolute;inset:0;width:1600px;height:900px;overflow:hidden;padding:76px 96px 108px;display:none;background:var(--bg)}
.slide.is-active{display:flex;flex-direction:column}
.slide.hero{background:var(--fg);color:var(--bg)}
.slide.depth{background:radial-gradient(120% 90% at 80% 10%,var(--surface-1),var(--bg))}
.slide.spotlight{background:#101010;color:#FAFAFA}
h1{font:700 80px/1.02 var(--font-display);letter-spacing:-.045em;text-wrap:balance}
h2{font:650 52px/1.05 var(--font-display);letter-spacing:-.04em;text-wrap:balance}
h3{font:600 24px/1.15 var(--font-display)}
.lede{font-size:25px;line-height:1.42;max-width:65ch;text-wrap:pretty}
p,li{font-size:18px;line-height:1.5;text-wrap:pretty}
.eyebrow{font:700 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
ul{list-style:none;display:grid;gap:16px}
li{display:flex;gap:16px;align-items:flex-start}
li svg{flex:0 0 24px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-foot{position:absolute;left:96px;bottom:32px;height:32px}
.slide.hero .logo-foot,.slide.no-foot .logo-foot{display:none}
.nav{position:fixed;right:52px;bottom:25px;display:flex;gap:12px;align-items:center;z-index:5;font:600 14px var(--font-body)}
.nav button{width:48px;height:48px;border-radius:50%;border:1px solid var(--hairline);background:var(--surface-1);color:var(--fg);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{position:fixed;left:0;bottom:0;height:4px;width:100%;background:var(--hairline);z-index:5}
.progress-fill{height:100%;width:0;background:var(--accent);transition:width .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="deck">
  <section class="slide hero">
    <p class="eyebrow">[Eyebrow]</p>
    <h1>[Titulo literal da copy]</h1>
  </section>
  <section class="slide">
    <p class="eyebrow">[Secao]</p>
    <h2>[Titulo]</h2>
    <ul>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span>[Item]</span></li>
    </ul>
    <!-- <img class="logo-foot" src="data:image/svg+xml;base64,..." alt="[Cliente]"> -->
  </section>
</main>
<nav class="nav" aria-label="Navega&ccedil;&atilde;o">
  <span id="count" aria-live="polite"></span>
  <button data-testid="prev-slide" aria-label="Anterior">&larr;</button>
  <button data-testid="next-slide" aria-label="Pr&oacute;ximo">&rarr;</button>
</nav>
<div class="progress"><div class="progress-fill"></div></div>
<script>
(function(){'use strict';
var S=[].slice.call(document.querySelectorAll('.slide')),i=0,
P=document.querySelector('[data-testid="prev-slide"]'),N=document.querySelector('[data-testid="next-slide"]'),
F=document.querySelector('.progress-fill'),C=document.getElementById('count');
function fitDeck(){var v=window.visualViewport||{width:innerWidth,height:innerHeight};
document.documentElement.style.setProperty('--deck-scale',Math.max(.1,Math.min((v.width-16)/1600,(v.height-16)/900,1)));}
function go(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach(function(s,k){s.classList.toggle('is-active',k===i);});
P.disabled=i===0;N.disabled=i===S.length-1;F.style.width=(S.length>1?i/(S.length-1)*100:100)+'%';C.textContent=(i+1)+' / '+S.length;}
P.onclick=function(){go(i-1);};N.onclick=function(){go(i+1);};
addEventListener('keydown',function(e){var k=e.key;
if(k==='ArrowRight'||k===' '||k==='PageDown'){e.preventDefault();go(i+1);}
else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(i-1);}
else if(k==='Home')go(0);else if(k==='End')go(S.length-1);});
var x0=null;addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>=50)go(i+(d<0?1:-1));x0=null;});
(window.visualViewport||window).addEventListener('resize',fitDeck);addEventListener('resize',fitDeck);
fitDeck();go(0);})();
</script>
</body>
</html>
